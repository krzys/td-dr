<!DOCTYPE html>
<html lang="en" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="x-apple-disable-message-reformatting">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no">
<title></title>
<!--[if mso]><noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript><![endif]-->
<style>
body { margin:0; padding:0; width:100% !important; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
table, td { border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt; }
img { border:0; outline:none; text-decoration:none; -ms-interpolation-mode:bicubic; }
a[x-apple-data-detectors] { color:inherit !important; text-decoration:none !important; }
u + #body a { color:inherit; text-decoration:none; }
</style>
<style>
@media screen and (max-width:480px) {
  .t-0 { max-width:632px !important; }
  .t-1 { padding:16px !important; }
  .t-2 { color:#92400e !important; }
  .t-3 { display:none !important; max-height:0 !important; overflow:hidden !important; }
}
</style>
</head>
<body id="body" style="margin:0;padding:0;">
<div role="article" aria-roledescription="email" lang="en">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;">
<tr><td align="center" style="padding:0;">
<!--[if mso]><table role="presentation" cellpadding="0" cellspacing="0" border="0" width="664" align="center"><tr><td width="664"><![endif]-->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;max-width:664px;table-layout:fixed;">
<tr><td style="text-align:left;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;table-layout:fixed;">
<tr>
<td>
<table class="t-0" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" align="center" style="width:100%;max-width:664px;margin:0 auto;table-layout:fixed;">
<tr>
<td class="t-1" bgcolor="#ffffff" style="padding:32px;background-color:#ffffff;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;table-layout:fixed;">
<tr>
<td style="padding:8px 0;"><p style="font-size:16px;font-family:Arial, Helvetica, sans-serif;line-height:24px;color:#111827;mso-line-height-rule:exactly;margin:0">Hi {{ user.name | escape }}, your <span class="{{ user.tier | escape }} t-2" style="color:#b45309">{{ user.tierName | escape }}</span> perks are active.</p></td>
</tr>
{% for item in items %}
<tr>
<td style="padding:8px 0;"><p style="font-size:16px;font-family:Arial, Helvetica, sans-serif;line-height:24px;color:#111827;mso-line-height-rule:exactly;margin:0">{{ item.title | escape }}</p></td>
</tr>
{% endfor %}
{% if user.vip and user.vip != 0 and user.vip != "" %}
<tr>
<td class="t-3">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;table-layout:fixed;">
<tr>
<td bgcolor="#fef3c7" style="padding:8px 12px;background-color:#fef3c7;color:#111827;font-family:Arial, Helvetica, sans-serif;font-size:16px;line-height:24px;mso-line-height-rule:exactly;">Tap and hold the card to save it.</td>
</tr>
</table>
</td>
</tr>
{% endif %}
</table>
</td>
</tr>
</table>
</td>
</tr>
</table></td></tr>
</table>
<!--[if mso]></td></tr></table><![endif]-->
</td></tr>
</table>
</div>
</body>
</html>
