<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { margin: 0; font-family: Arial, sans-serif; }
.ticket { display: flex; flex-direction: column; justify-content: space-around; min-height: 320px; padding: 24px; background: #0e7490; color: #ffffff; }
p { margin: 0; font-size: 14px; line-height: 20px; }
h1 { margin: 0; font-size: 28px; line-height: 34px; }
@media (max-width: 480px) {
  .ticket { justify-content: space-evenly; }
}
</style>
</head>
<body>
<div style="max-width: 600px; margin: 0 auto;">
  <div class="ticket">
    <p>Booking QX7P2L</p>
    <h1>Your trip is confirmed</h1>
    <p>London to New York</p>
  </div>
</div>
</body>
</html>
