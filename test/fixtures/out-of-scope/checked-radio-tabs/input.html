<style>
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px; font-family: Arial, Helvetica, sans-serif; color: #1f2933; }
  .tabs input { display: none; }
  .tabs label { display: inline-block; padding: 8px 14px; border: 1px solid #c7ccd1; font-size: 14px; }
  .panel { display: none; padding: 16px; border: 1px solid #c7ccd1; font-size: 15px; line-height: 22px; }
  #tab-week:checked ~ .week, #tab-month:checked ~ .month { display: block; }
  #tab-week:checked ~ label[for=tab-week], #tab-month:checked ~ label[for=tab-month] { background-color: #2f6f4e; color: #ffffff; }
</style>
<div class="wrap">
  <h2 style="margin: 0 0 12px; font-size: 20px;">Your activity</h2>
  <div class="tabs">
    <input type="radio" name="range" id="tab-week" checked>
    <input type="radio" name="range" id="tab-month">
    <label for="tab-week">This week</label>
    <label for="tab-month">This month</label>
    <div class="panel week">You walked 21 km over 5 days this week.</div>
    <div class="panel month">You walked 88 km over 19 days this month.</div>
  </div>
</div>
