<style>
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px; font-family: Arial, Helvetica, sans-serif; color: #1f2933; }
  .faq input { display: none; }
  .faq h3 { margin: 0; padding: 12px 0; font-size: 16px; border-top: 1px solid #c7ccd1; }
  .answer { display: none; padding: 0 0 12px; font-size: 15px; line-height: 22px; }
  #q-refund:checked ~ .refund, #q-ship:checked ~ .ship { display: block; }
</style>
<div class="wrap">
  <h2 style="margin: 0 0 12px; font-size: 20px;">Questions</h2>
  <div class="faq">
    <input type="checkbox" id="q-refund">
    <label for="q-refund"><h3>How do refunds work?</h3></label>
    <div class="answer refund">Send the parcel back within 30 days and the money is on your card a week later.</div>
    <input type="checkbox" id="q-ship" checked>
    <label for="q-ship"><h3>When will my order ship?</h3></label>
    <div class="answer ship">Orders placed before noon leave the warehouse the same day.</div>
  </div>
</div>
