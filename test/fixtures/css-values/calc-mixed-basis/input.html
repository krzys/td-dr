<div style="max-width: 600px; margin: 0 auto; font-family: Arial, Helvetica, sans-serif; font-size: 14px; line-height: 20px;">
  <div style="display: flex; gap: 1rem;">
    <div style="flex: 0 0 calc(50% - 0.5rem); box-sizing: border-box; padding: 12px; background-color: #e0e7ff;">Half, less half the 1rem gap</div>
    <div style="flex: 0 0 calc(50% - 0.5rem); box-sizing: border-box; padding: 12px; background-color: #fde68a;">The other half</div>
  </div>
  <div style="display: flex; gap: 20px; margin-top: 16px;">
    <div style="flex: 0 0 calc((100% - 20px) / 2); box-sizing: border-box; padding: 12px; background-color: #d1fae5;">Half of what the gap leaves</div>
    <div style="flex: 0 0 calc((100% - 20px) / 2); box-sizing: border-box; padding: 12px; background-color: #fce7f3;">The other half</div>
  </div>
  <div style="display: flex; gap: 20px; margin-top: 16px;">
    <div style="flex: 0 0 calc(50% - 4px - 6px); box-sizing: border-box; padding: 12px; background-color: #ede9fe;">Half, two px terms</div>
    <div style="flex: 0 0 calc(50% - 4px - 6px); box-sizing: border-box; padding: 12px; background-color: #fef3c7;">Half again</div>
  </div>
</div>
