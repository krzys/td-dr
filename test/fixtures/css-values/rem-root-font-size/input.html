<!doctype html>
<html>
<head>
<style>
  html { font-size: 62.5%; }
  :root { --gap: 2.4rem; }
  body { margin: 0; font-family: Helvetica, Arial, sans-serif; font-size: 1.6rem; color: #1f2937; }
  .wrap { max-width: 56rem; margin: 0 auto; padding: var(--gap) 2rem; background-color: #f3f4f6; }
  .title { margin: 0 0 1.2rem; font-size: 2.8rem; line-height: 3.6rem; color: #111827; }
  .lead { margin: 0 0 calc(var(--gap) / 2); font-size: 1.25em; line-height: 1.5; }
  .note { margin: 0; padding: 1.2rem 1.6rem; font-size: clamp(1.2rem, 1.4rem, 2rem); line-height: calc(1rem + 1.2rem); border-top: 0.4rem solid #2563eb; background-color: #ffffff; }
  .note b { font-size: 0.875em; letter-spacing: max(0.1rem, 0.5px); }
  @media (max-width: 30em) {
    .wrap { padding: 1.6rem 1.2rem; }
    .title { font-size: 2.2rem; line-height: 2.8rem; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1 class="title">Sizes from a 10px root</h1>
    <p class="lead">The root font-size is 62.5%, so 1rem is 10px in every declaration here.</p>
    <p class="note">Calc, clamp and max with rem, a custom property in rem, and <b>nested em</b> under rem text.</p>
  </div>
</body>
</html>
