<div style="max-width: 600px; margin: 0 auto; font-family: Arial, Helvetica, sans-serif; line-height: 1.3;">
  <h1 style="margin: 0 0 12px; font-size: clamp(16px, 4vw, 24px);">Headline sized by clamp()</h1>
  <p style="margin: 0; font-size: clamp(12px, 1.5vw, 20px); padding: 0 calc(2vw + 4px); background-color: #e0e7ff;">Body copy: 1.5vw is 9px, clamped up to 12px, and the padding folds to 16px.</p>
</div>
