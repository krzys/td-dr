<div style="max-width: 600px; margin: 0 auto; padding: 24px; font-family: Arial, Helvetica, sans-serif; color: #1f2937;">
  <h2 style="margin: 0 0 12px 0; font-size: 18px; line-height: 24px;">Your items</h2>
  <div style="padding: 0 0 16px 0;">
    <div data-email-each="order.items" data-email-as="line" style="display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid #e5e7eb; font-size: 15px; line-height: 22px;">
      <span>{{line.qty}} x {{line.name}}</span>
      <span>{{line.price}} {{order.currency}}</span>
    </div>
  </div>
  <p style="margin: 0; font-size: 15px; line-height: 22px; font-weight: bold;">Total: {{order.total}} {{order.currency}}</p>
</div>
