<div style="max-width: 600px; margin: 0 auto; padding: 24px; font-family: Arial, Helvetica, sans-serif; font-size: 15px; line-height: 22px; color: #1f2937;">
  <p style="margin: 0;">Before</p>
  <div data-email-if="banner" style="margin: 0 0 16px 0; padding: 10px 12px; background: #fef9c3;">{{banner}}</div>
  <p style="margin: 0;">Middle</p>
  <div data-email-each="rows" data-email-as="row" style="margin: 0 0 8px 0; padding: 6px 12px; background: #f3f4f6;">{{row.text}}</div>
  <p style="margin: 0;">After</p>
</div>
