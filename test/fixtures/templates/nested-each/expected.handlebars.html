<!DOCTYPE html>
<html lang="en" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="x-apple-disable-message-reformatting">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no">
<title></title>
<!--[if mso]><noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript><![endif]-->
<style>
body { margin:0; padding:0; width:100% !important; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
table, td { border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt; }
img { border:0; outline:none; text-decoration:none; -ms-interpolation-mode:bicubic; }
a[x-apple-data-detectors] { color:inherit !important; text-decoration:none !important; }
u + #body a { color:inherit; text-decoration:none; }
</style>
</head>
<body id="body" style="margin:0;padding:0;">
<div role="article" aria-roledescription="email" lang="en">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;line-height:normal;">
<tr><td align="center" style="padding:0;">
<!--[if mso]><table role="presentation" cellpadding="0" cellspacing="0" border="0" width="648" align="center"><tr><td width="648"><![endif]-->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;max-width:648px;table-layout:fixed;">
<tr><td style="text-align:left;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;table-layout:fixed;">
<tr>
<td>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" align="center" style="width:100%;max-width:648px;margin:0 auto;table-layout:fixed;">
<tr>
<td style="padding:24px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;table-layout:fixed;">
{{#each shipments as |ship|}}
<tr>
<td style="padding:12px 0;border-top:1px solid #d1d5db;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;table-layout:fixed;">
<tr>
<td style="padding:0 0 8px 0;"><h3 style="font-family:Arial, Helvetica, sans-serif;color:#1f2937;font-size:16px;font-weight:bold;line-height:22px;mso-line-height-rule:exactly;margin:0">Shipment {{ship.id}} to {{ship.city}}</h3></td>
</tr>
{{#each ship.parcels as |parcel|}}
<tr>
<td style="padding:4px 0;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;">
<tr>
<td valign="top" align="left" style="color:#1f2937;font-family:Arial, Helvetica, sans-serif;font-size:14px;line-height:20px;mso-line-height-rule:exactly;"><span style="font-family:Arial, Helvetica, sans-serif;color:#1f2937;font-size:14px;line-height:20px;mso-line-height-rule:exactly;display:inline-block;margin:0">{{parcel.label}}</span></td>
<td valign="top" align="right" style="color:#1f2937;font-family:Arial, Helvetica, sans-serif;font-size:14px;line-height:20px;mso-line-height-rule:exactly;"><span style="font-family:Arial, Helvetica, sans-serif;color:#1f2937;font-size:14px;line-height:20px;mso-line-height-rule:exactly;display:inline-block;margin:0">{{parcel.weight}} {{@root.units}}</span></td>
</tr>
</table>
</td>
</tr>
{{/each}}
</table>
</td>
</tr>
{{/each}}
</table>
</td>
</tr>
</table>
</td>
</tr>
</table></td></tr>
</table>
<!--[if mso]></td></tr></table><![endif]-->
</td></tr>
</table>
</div>
</body>
</html>
