<div style="max-width: 600px; margin: 0 auto; font-family: Arial, Helvetica, sans-serif; color: #1f2937;">
  <div style="padding: 20px 24px; background: #111827; color: #ffffff;">
    <h1 style="margin: 0; font-size: 20px; line-height: 26px;">Order {{order.id}}</h1>
  </div>
  <div data-email-if="order.status == 'paid'" style="padding: 16px 24px; background: #dcfce7; color: #166534; font-size: 15px; line-height: 22px;">
    Payment received. We are packing your order.
  </div>
  <div data-email-else-if="order.status == 'shipped'" style="padding: 16px 24px; background: #dbeafe; color: #1e40af; font-size: 15px; line-height: 22px;">
    On its way with {{order.carrier}}. Tracking: <b>{{order.tracking}}</b>
  </div>
  <div data-email-else-if="order.delayed" style="padding: 16px 24px; background: #fef3c7; color: #92400e; font-size: 15px; line-height: 22px;">
    Sorry, your order is delayed. New date: {{order.eta}}.
  </div>
  <div data-email-else style="padding: 16px 24px; background: #f3f4f6; font-size: 15px; line-height: 22px;">
    We have your order and will email you when it moves.
  </div>
  <p style="margin: 0; padding: 16px 24px; font-size: 13px; line-height: 20px; color: #6b7280;">Questions? Reply to this email.</p>
</div>
