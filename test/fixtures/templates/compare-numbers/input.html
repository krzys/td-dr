<div style="max-width: 600px; margin: 0 auto; font-family: Arial, Helvetica, sans-serif; color: #1f2937;">
  <div style="padding: 20px 24px; background: #f3f4f6;">
    <h1 style="margin: 0; font-size: 22px; line-height: 28px;">Order {{order.number}}</h1>
  </div>
  <div data-email-if="order.qty == 0" style="padding: 12px 24px; background: #fef3c7; color: #92400e; font-size: 14px; line-height: 20px;">
    Nothing left to ship.
  </div>
  <div data-email-unless="order.qty == 0" style="padding: 12px 24px; font-size: 14px; line-height: 20px;">
    Quantity: {{order.qty}}<span data-email-if="order.qty != 1"> (several items)</span>
  </div>
</div>
