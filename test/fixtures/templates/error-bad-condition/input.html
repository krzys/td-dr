<div style="font-family: Arial, Helvetica, sans-serif; font-size: 15px; padding: 16px;">
  <div data-email-if="a &&">ends early</div>
  <div data-email-if="ok">ok</div>
  <div data-email-else-if="b === 'x'">triple equals</div>
  <tddr-if test="(a || b"><p style="margin: 0;">unclosed</p></tddr-if>
  <tddr-if><p style="margin: 0;">no test</p></tddr-if>
  <div data-email-if="c">c</div>
  <div data-email-else="x">else with a value</div>
  <tddr-if test="d" class="note"><p style="margin: 0;">class on tddr-if</p></tddr-if>
</div>
