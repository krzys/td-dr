<!DOCTYPE html>
<html lang="en" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="x-apple-disable-message-reformatting">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no">
<title></title>
<!--[if mso]><noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript><![endif]-->
<style>
body { margin:0; padding:0; width:100% !important; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
table, td { border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt; }
img { border:0; outline:none; text-decoration:none; -ms-interpolation-mode:bicubic; }
a[x-apple-data-detectors] { color:inherit !important; text-decoration:none !important; }
u + #body a { color:inherit; text-decoration:none; }
</style>
<!--[if mso]>
<style>p,a,h1{mso-line-height-rule:exactly;}</style>
<![endif]-->
</head>
<body id="body" style="margin:0;padding:0;">
<div role="article" aria-roledescription="email" lang="en">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;line-height:normal;">
<tr><td align="center" style="padding:0;">
<!--[if mso]><table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" align="center"><tr><td width="600"><![endif]-->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;max-width:600px;table-layout:fixed;">
<tr><td style="text-align:left;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;table-layout:fixed;">
<tr>
<td>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" align="center" style="width:100%;max-width:600px;margin:0 auto;table-layout:fixed;">
<tr>
<td bgcolor="{{ brand.bg | escape }}" style="padding:24px;background-color:{{ brand.bg | escape }};">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;table-layout:fixed;">
<tr>
<td style="padding:0 0 8px 0;"><h1 style="font-family:Arial, Helvetica, sans-serif;color:{{ brand.fg | escape }};font-size:22px;font-weight:bold;line-height:28px;margin:0">Hi {{ user.name | escape }}</h1></td>
</tr>
<tr>
<td style="padding:0 0 12px 0;"><p style="font-family:Arial, Helvetica, sans-serif;color:{{ brand.fg | escape }};font-size:14px;line-height:20px;margin:0">Your order is on its way.</p></td>
</tr>
<tr>
<td style="padding:8px 12px;background-color:rgba(255, 255, 255, 0.25);"><p style="font-family:Arial, Helvetica, sans-serif;color:{{ brand.fg | escape }};font-size:14px;line-height:20px;margin:0">Tracking: {{ order.tracking | escape }}</p></td>
</tr>
</table>
</td>
</tr>
<tr>
<td style="padding:16px 24px;border-top:3px solid {{ brand.accent | escape }};color:#1f2937;font-family:Arial, Helvetica, sans-serif;font-size:14px;line-height:20px;mso-line-height-rule:exactly;">
    Need help? Reply to this email.
  </td>
</tr>
<tr>
<td style="padding:0 24px 24px 24px;"><!--[if mso]><v:roundrect href="{{ order.url | escape }}" xmlns:w="urn:schemas-microsoft-com:office:word" style="height:48px;v-text-anchor:middle;width:212px;" arcsize="13%" strokecolor="{{ brand.edge | escape }}" strokeweight="2px" fillcolor="{{ brand.button | escape }}"><w:anchorlock/><center style="color:#ffffff;font-family:Arial, Helvetica, sans-serif;font-size:16px;font-weight:bold;">View order</center></v:roundrect><![endif]-->
<!--[if !mso]><!--><table role="presentation" border="0" cellpadding="0" cellspacing="0" width="212" style="width:212px;border-collapse:separate;">
<tr>
<td align="center" bgcolor="{{ brand.button | escape }}" style="background-color:{{ brand.button | escape }};border-top:2px solid {{ brand.edge | escape }};border-right:2px solid {{ brand.edge | escape }};border-bottom:2px solid {{ brand.edge | escape }};border-left:2px solid {{ brand.edge | escape }};border-radius:6px;mso-padding-alt:12px 24px;">
<a href="{{ order.url | escape }}" style="display:block;padding:12px 24px;color:#ffffff;font-family:Arial, Helvetica, sans-serif;font-size:16px;font-weight:bold;line-height:20px;text-align:center;text-decoration:none;">View order</a>
</td>
</tr>
</table><!--<![endif]--></td>
</tr>
</table>
</td>
</tr>
</table></td></tr>
</table>
<!--[if mso]></td></tr></table><![endif]-->
</td></tr>
</table>
</div>
</body>
</html>
