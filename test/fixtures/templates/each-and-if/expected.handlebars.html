<!DOCTYPE html>
<html lang="en" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="x-apple-disable-message-reformatting">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no">
<title></title>
<!--[if mso]><noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript><![endif]-->
<style>
body { margin:0; padding:0; width:100% !important; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
table, td { border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt; }
img { border:0; outline:none; text-decoration:none; -ms-interpolation-mode:bicubic; }
a[x-apple-data-detectors] { color:inherit !important; text-decoration:none !important; }
u + #body a { color:inherit; text-decoration:none; }
</style>
</head>
<body id="body" style="margin:0;padding:0;">
<div role="article" aria-roledescription="email" lang="en">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;">
<tr><td align="center" style="padding:0;">
<!--[if mso]><table role="presentation" cellpadding="0" cellspacing="0" border="0" width="648" align="center"><tr><td width="648"><![endif]-->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;max-width:648px;table-layout:fixed;">
<tr><td><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;table-layout:fixed;">
<tr>
<td>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" align="center" style="width:100%;max-width:648px;margin:0 auto;table-layout:fixed;">
<tr>
<td style="padding:24px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;table-layout:fixed;">
<tr>
<td style="padding:0 0 12px 0;"><p style="font-family:Arial, Helvetica, sans-serif;color:#1f2937;font-size:16px;line-height:24px;mso-line-height-rule:exactly;margin:0">Hello {{user.name}}.</p></td>
</tr>
{{#if show}}
{{#each deals as |deal|}}
<tr>
<td style="padding:0 0 8px 0;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:separate;table-layout:fixed;">
<tr>
<td bgcolor="#fef3c7" style="padding:12px 16px;background-color:#fef3c7;border-radius:6px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;table-layout:fixed;">
<tr>
<td style="color:#1f2937;font-family:Arial, Helvetica, sans-serif;font-size:15px;line-height:22px;mso-line-height-rule:exactly;">
    <b style="font-weight:bold">{{deal.title}}</b> for {{deal.price}}
    </td>
</tr>
{{#if deal.onSale}}
<tr>
<td style="padding:4px 0 0 0;color:#b45309;font-family:Arial, Helvetica, sans-serif;font-size:13px;line-height:22px;mso-line-height-rule:exactly;">On sale: was {{deal.was}}</td>
</tr>
{{/if}}
</table>
</td>
</tr>
</table>
</td>
</tr>
{{/each}}
{{/if}}
<tr>
<td><p style="font-family:Arial, Helvetica, sans-serif;color:#6b7280;font-size:13px;line-height:20px;mso-line-height-rule:exactly;margin:0">Prices include tax.</p></td>
</tr>
</table>
</td>
</tr>
</table>
</td>
</tr>
</table></td></tr>
</table>
<!--[if mso]></td></tr></table><![endif]-->
</td></tr>
</table>
</div>
</body>
</html>
