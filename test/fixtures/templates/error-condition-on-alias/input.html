<div style="font-family: Arial, Helvetica, sans-serif; font-size: 15px; padding: 16px;">
  <div data-email-each="items" data-email-as="i" data-email-if="i.show">{{i.name}}</div>
  <div data-email-each="items" data-email-as="i" data-email-unless="i.sub">{{i.name}}</div>
  <div data-email-each="items" data-email-if="item.show">{{item.name}}</div>
</div>
