<style>
body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: #1e293b; }
.wrap { max-width: 600px; margin: 0 auto; padding: 24px; }
.badge {
  display: inline-block;
  padding: 6px 10px;
  background-color: #c7d2fe;
  color: #312e81;
  font-size: 13px;
  @supports (color: color-mix(in lab, red, red)) {
    background-color: #e0e7ff;
  }
}
.note { margin-top: 16px; font-size: 15px; line-height: 22px; }
@supports (not (-webkit-appearance: -apple-pay-button)) or (contain-intrinsic-size: 1px) {
  .note { color: #334155; }
}
@supports ((-webkit-hyphens: none) and (not (margin-trim: inline))) or ((-moz-orient: inline) and (not (color: rgb(from red r g b)))) {
  .note { color: #b91c1c; }
}
@supports (display: flex) and selector(.wrap > p) {
  .lead { font-size: 18px; line-height: 26px; font-weight: bold; }
}
@supports (margin-trim: block) {
  .note { margin-top: 40px; }
}
</style>
<div class="wrap">
  <p class="lead">Your receipt</p>
  <span class="badge">Paid</span>
  <p class="note">Thanks for your order. The colour of this line comes from a decidable @supports block.</p>
</div>
