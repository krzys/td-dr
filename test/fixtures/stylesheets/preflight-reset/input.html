<style>
@layer theme, base, utilities;
@layer theme {
  :root, :host { --font-sans: Arial, Helvetica, sans-serif; --color-ink: #111827; }
}
@layer base {
  *, ::after, ::before, ::backdrop, ::file-selector-button { box-sizing: border-box; margin: 0; padding: 0; border: 0 solid; }
  html, :host {
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
    tab-size: 4;
    font-family: var(--default-font-family, var(--font-sans));
    font-feature-settings: var(--default-font-feature-settings, normal);
    -webkit-tap-highlight-color: transparent;
  }
  hr { height: 0; color: inherit; border-top-width: 1px; }
  h1, h2, h3, h4, h5, h6 { font-size: inherit; font-weight: inherit; }
  a { color: inherit; -webkit-text-decoration: inherit; text-decoration: inherit; }
  b, strong { font-weight: bolder; }
  small { font-size: 80%; }
  table { text-indent: 0; border-color: inherit; border-collapse: collapse; }
  :-moz-focusring:where(:not(iframe)) { outline: auto; }
  ol, ul, menu { list-style: none; }
  img, svg, video { display: block; vertical-align: middle; }
  img, video { max-width: 100%; height: auto; }
  button, input, select, textarea, ::file-selector-button { font: inherit; color: inherit; background-color: transparent; }
  :where(select:is([multiple], [size])) optgroup { font-weight: bolder; }
  ::file-selector-button { margin-inline-end: 4px; }
  ::placeholder { opacity: 1; }
  @supports (not (-webkit-appearance: -apple-pay-button)) or (contain-intrinsic-size: 1px) {
    ::placeholder {
      color: currentcolor;
      @supports (color: color-mix(in lab, red, red)) {
        color: color-mix(in oklab, currentcolor 50%, transparent);
      }
    }
  }
  ::-webkit-search-decoration { -webkit-appearance: none; }
  ::-webkit-date-and-time-value { min-height: 1lh; text-align: inherit; }
  ::-webkit-datetime-edit, ::-webkit-datetime-edit-year-field, ::-webkit-datetime-edit-month-field { padding-block: 0; }
  :-moz-ui-invalid { box-shadow: none; }
  ::-webkit-inner-spin-button, ::-webkit-outer-spin-button { height: auto; }
  [hidden]:where(:not([hidden="until-found"])) { display: none !important; }
}
@layer utilities {
  .wrap { max-width: 600px; margin: 0 auto; padding: 24px; color: var(--color-ink); }
  .title { font-size: 22px; line-height: 30px; font-weight: bold; }
  .copy { margin-top: 12px; font-size: 15px; line-height: 22px; }
  .link { color: #2563eb; text-decoration: underline; }
}
</style>
<div class="wrap">
  <h1 class="title">Welcome aboard</h1>
  <p class="copy">Thanks for signing up. Your account is ready and your first project is waiting for you.</p>
  <p class="copy"><a class="link" href="https://example.com/start">Open your dashboard</a> <small>(takes a minute)</small></p>
</div>
