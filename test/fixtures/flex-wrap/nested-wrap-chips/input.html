<style>
  .outer { display: flex; flex-direction: row; flex-wrap: wrap; gap: 16px; padding: 16px; background-color: #ffffff; font-family: Arial, Helvetica, sans-serif; }
  .group { flex: 0 0 270px; width: 270px; box-sizing: border-box; padding: 12px; border: 1px solid #e5e7eb; }
  .group-title { margin: 0 0 8px; font-size: 14px; font-weight: bold; color: #111827; }
  .chips { display: flex; flex-direction: row; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 4px 10px; background-color: #e5e7eb; font-size: 12px; color: #1f2937; }
</style>
<div class="outer">
  <div class="group">
    <p class="group-title">Sizes</p>
    <div class="chips">
      <span class="chip">XS</span>
      <span class="chip">S</span>
      <span class="chip">M</span>
      <span class="chip">L</span>
      <span class="chip">XL</span>
    </div>
  </div>
  <div class="group">
    <p class="group-title">Colours</p>
    <div class="chips">
      <span class="chip">Navy</span>
      <span class="chip">Sand</span>
      <span class="chip">Forest</span>
    </div>
  </div>
</div>
