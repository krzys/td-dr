name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the engines floor and the current LTS
        node: ["22.18", 24]
    steps:
      - uses: actions/checkout@v5
      # pnpm version from package.json "packageManager"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm smoke

  visual:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    env:
      TDDR_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the playwright version the lockfile pins; locally PLAYWRIGHT_BROWSERS_PATH may point at a preinstalled one
      - run: pnpm exec playwright install --with-deps ${{ matrix.engine }}
      # the font test/harness/fonts.conf sets up
      - run: sudo apt-get install -y --no-install-recommends fonts-inter
      - run: pnpm test:visual
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs-${{ matrix.engine }}
          path: test/.visual/
          if-no-files-found: ignore
          include-hidden-files: true
