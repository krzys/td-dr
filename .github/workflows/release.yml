name: Release

# Publishes to npm when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0).
# Uses npm trusted publishing: no token, the registry trusts this workflow through OIDC and adds
# provenance. The trusted publisher (this repository, release.yml) is set on the package's npm page.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@^11.5.1
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm smoke
      - run: npm publish --access public
